<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Recuerdos 🧠</title>
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>

<body class="hearts-bg">
  <div class="wrap">
    <div class="card glow">
      <div class="topbar">
        <a class="btn" href="home.html">⬅ Volver</a>
        <h1 class="title small">Recuerdos 🧠</h1>
      </div>

      <p class="subtitle">Momentos que guardo en mi corazón 💞</p>

      <!-- 🎵 Música Recuerdos -->
      <div class="audioBox">
        <button id="btnPlayMusic" class="btn">Reproducir música 🎵</button>

        <div class="volRow">
          <span>🔊</span>
          <input id="vol" type="range" min="0" max="100" value="75" />
          <span id="volLabel">75%</span>
        </div>
      </div>

      <audio id="bgAudio" src="assets/music/recuerdos.mp3" preload="auto" loop></audio>

      <!-- Botones de recuerdos -->
      <div class="row" style="margin-top:16px;">
        <button class="btn primary" data-r="1">Recuerdo 1</button>
        <button class="btn primary" data-r="2">Recuerdo 2</button>
        <button class="btn primary" data-r="3">Recuerdo 3</button>
      </div>

      <!-- Contenido -->
      <div id="recBox" class="letter hidden"></div>
    </div>

    <footer class="footer">
      Desarrollado con el amor que le tengo ❤️
    </footer>
  </div>

  <script src="assets/js/app.js"></script>
  <script>
    // 🔐 Protección
    LoveApp.protect();

    // 🎵 Música + volumen
    const audio = document.getElementById("bgAudio");
    const playBtn = document.getElementById("btnPlayMusic");
    const vol = document.getElementById("vol");
    const volLabel = document.getElementById("volLabel");

    audio.volume = 0.75;

    playBtn.addEventListener("click", () => {
      audio.play().catch(()=>{});
      playBtn.textContent = "Música activada 🎶";
    });

    vol.addEventListener("input", () => {
      audio.volume = vol.value / 100;
      volLabel.textContent = vol.value + "%";
    });

    // 🧠 Recuerdos
    const box = document.getElementById("recBox");
const recuerdos = {
  1: `
    <h2>Recuerdo 1 💗</h2>
    <p>
      Cuando usted me estaba pidiendo pololeo jsjs…
      ay bb, en ese momento yo estaba <b>muy, muy nervioso</b>,
      pero de verdad MUCHO jsjs.
    </p>
    <p>
      Sentía que me moría ahí mismo,
      pero obviamente le iba a decir que sí,
      porque <b>la amo mucho</b> y no había otra respuesta posible.
    </p>
    <p class="sig">— Ese día mi corazón dijo que sí 💘</p>
  `,

  2: `
    <h2>Recuerdo 2 💞</h2>
    <p>
      Cuando usted entró y me estaba contando algo,
      y yo le di un beso jsjs…
    </p>
    <p>
      En ese momento fue muy bonito,
      pero no le voy a mentir,
      <b>igual me dio vergüenza</b> jsjs.
    </p>
    <p>
      Aun así, fue uno de esos momentos
      que se quedan guardados en el corazón.
    </p>
    <p class="sig">— Un beso que no olvido 💗</p>
  `,

  3: `
    <h2>Recuerdo 3 💖</h2>
    <p>
      Cuando estábamos en el kiosko Combi
      y usted me botó sjksjs 😭
    </p>
    <p>
      Y después lo de la araña de rincón…
      ay bb, qué risa y qué susto al mismo tiempo jsjs.
    </p>
    <p>
      Son esas tonteras las que hacen todo más lindo,
      porque con usted hasta caerse es un recuerdo bonito.
    </p>
    <p class="sig">— Siempre riéndome con usted 💘</p>
  `
};

   

    document.querySelectorAll("[data-r]").forEach(btn => {
      btn.addEventListener("click", () => {
        box.classList.remove("hidden");
        box.innerHTML = recuerdos[btn.dataset.r];
        box.scrollIntoView({behavior:"smooth", block:"start"});
      });
    });
  </script>
</body>
</html>
