<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Verifícate bb</title>
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>

<body class="hearts-bg">
  <div class="wrap">
    <div class="card glow">
      <h1 class="title">Verifícate bb 💗</h1>

      <p class="subtitle">User: <b>Camote predeterminado</b></p>

      <div class="hint">
        <div>🧩 Pista: <b>El día que inició todo</b></div>
        <div class="roman">XVI</div>
      </div>

      <div class="form">
        <label class="label" for="pass1">Contraseña</label>
        <input id="pass1" class="input" type="password" placeholder="••••••" autocomplete="off" />

        <button id="btnLogin" class="btn primary">Entrar</button>

        <!-- Música + Volumen -->
        <div class="audioBox">
          <button id="btnStartMusic" class="btn">Iniciar música 🎶</button>

          <div class="volRow">
            <span>🔊</span>
            <input id="vol" type="range" min="0" max="100" value="75" />
            <span id="volLabel">75%</span>
          </div>
        </div>

        <p id="msg" class="msg"></p>
      </div>
    </div>

    <footer class="footer">
      Desarrollado con el amor que le tengo ❤️
    </footer>
  </div>

  <!-- AUDIO LOGIN (Loco tu forma de ser) -->
  <audio id="bgAudio" src="assets/music/login.mp3" preload="auto" loop></audio>

  <script src="assets/js/app.js"></script>
  <script>
    // 1) Volumen 75% + slider + botón
    LoveApp.initMusicUI("bgAudio", "btnStartMusic", "vol", "volLabel");

    // 2) Login
    LoveApp.initLogin();

    // 3) Cuando aprieta "Entrar", intentamos reproducir también (por si no tocó el botón)
    document.getElementById("btnLogin").addEventListener("click", () => {
      try { document.getElementById("bgAudio").play(); } catch(e) {}
    });
  </script>
</body>
</html>
