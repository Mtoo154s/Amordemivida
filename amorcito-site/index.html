<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Verifícate bb</title>
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body class="hearts-bg">
  <div class="wrap">

    <footer class="footer">
      Desarrollado con el amor que le tengo ❤️
    </footer>
  </div>

  <audio id="introAudio" src="assets/music/intro.mp3" preload="auto" loop></audio>

  <script src="assets/js/app.js"></script>
  <script>
    LoveApp.initLoginPage({
      correctPass: "16-04-25",
      next: "home.html",
      audioId: "introAudio",
      passInputId: "pass1",
      loginBtnId: "btnLogin",
      startMusicBtnId: "btnStartMusic",
      msgId: "msg"
    });
  </script>
</body>
</html>
