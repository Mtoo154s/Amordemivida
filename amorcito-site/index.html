<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Verifícate bb</title>
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>

<body class="hearts-bg">
  <div class="wrap">
    <div class="card glow">
      <h1 class="title">Verifícate bb 💗</h1>

      <p class="subtitle">User: <b>Camote</b></p>

      <div class="hint">
        <div>🧩 Pista: <b>El día que inició todo</b></div>
        <div class="roman">XVI</div>
      </div>

      <div class="form">
        <label class="label" for="pass1">Contraseña (visible)</label>
        <!-- visible -->
        <input id="pass1" class="input" type="text" placeholder="Escribe aquí..." autocomplete="off" />

        <button id="btnLogin" class="btn primary">Entrar</button>

        <!-- 🎵 Música + Volumen -->
        <div class="audioBox">
          <button id="btnStartMusic" class="btn">Iniciar música 🎶</button>

          <div class="volRow">
            <span>🔊</span>
            <input id="vol" type="range" min="0" max="100" value="75" />
            <span id="volLabel">75%</span>
          </div>
        </div>

        <p id="msg" class="msg"></p>
      </div>
    </div>

    <footer class="footer">
      Desarrollado con el amor que le tengo ❤️
    </footer>
  </div>

  <!-- AUDIO (asegúrate que exista: amorcito-site/assets/music/login.mp3) -->
  <audio id="bgAudio" src="assets/music/login.mp3" preload="auto" loop></audio>

  <script>
    // ===== CONFIG =====
    const CORRECT_PASS = "16-04-25";
    const NEXT_PAGE = "home.html";

    const passInput = document.getElementById("pass1");
    const btnLogin = document.getElementById("btnLogin");
    const msg = document.getElementById("msg");

    const audio = document.getElementById("bgAudio");
    const btnMusic = document.getElementById("btnStartMusic");
    const vol = document.getElementById("vol");
    const volLabel = document.getElementById("volLabel");

    // Volumen inicial 75%
    audio.volume = 0.75;

    // Slider volumen (actualiza audio + texto)
    function setVolUI(v){
      const n = Math.max(0, Math.min(100, Number(v)));
      vol.value = String(n);
      volLabel.textContent = `${n}%`;
      audio.volume = n / 100;
    }
    setVolUI(75);

    vol.addEventListener("input", () => setVolUI(vol.value));

    // Iniciar música (necesario por bloqueo autoplay)
    btnMusic.addEventListener("click", async () => {
      try {
        await audio.play();
        btnMusic.textContent = "Música activada 🎶";
      } catch (e) {
        msg.textContent = "Tu navegador bloqueó el audio. Toca el botón otra vez.";
      }
    });

    // Login
    function doLogin(){
      const v = (passInput.value || "").trim();
      if (v === CORRECT_PASS) {
        // guarda auth para proteger otras páginas
        localStorage.setItem("love_auth", "1");

        msg.textContent = "💗 Correcto bb... entrando";
        // intenta reproducir (como ya hubo click)
        audio.play().catch(()=>{});
        setTimeout(() => location.href = NEXT_PAGE, 450);
      } else {
        msg.textContent = "❌ Contraseña incorrecta bb";
        passInput.focus();
      }
    }

    btnLogin.addEventListener("click", doLogin);
    passInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") doLogin();
    });
  </script>
</body>
</html>
