<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Cartas 💌</title>
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>

<body class="hearts-bg">
  <div class="wrap">
    <div class="card glow">
      <div class="topbar">
        <a class="btn" href="home.html">⬅ Volver</a>
        <h1 class="title small">Cartas 💌</h1>
      </div>

      <p class="subtitle">Elige una carta, mi vida 💗</p>

      <!-- 🎵 Música Cartas -->
      <div class="audioBox">
        <button id="btnPlayMusic" class="btn">Reproducir música 🎵</button>

        <div class="volRow">
          <span>🔊</span>
          <input id="vol" type="range" min="0" max="100" value="75" />
          <span id="volLabel">75%</span>
        </div>
      </div>

      <audio id="bgAudio" src="assets/music/cartas.mp3" preload="auto" loop></audio>

      <!-- Botones de cartas -->
      <div class="row" style="margin-top:14px;">
        <button class="btn primary" id="btnCarta1">Carta 1</button>
        <button class="btn primary" id="btnCarta2">Carta 2</button>
      </div>

      <!-- Contenido -->
      <div id="letter" class="letter hidden"></div>
    </div>

    <footer class="footer">
      Desarrollado con el amor que le tengo ❤️
    </footer>
  </div>

  <script src="assets/js/app.js"></script>
  <script>
    // Proteger acceso (si no hizo login)
    LoveApp.protect();

    // Música + volumen 75%
    const audio = document.getElementById("bgAudio");
    const playBtn = document.getElementById("btnPlayMusic");
    const vol = document.getElementById("vol");
    const volLabel = document.getElementById("volLabel");

    audio.volume = 0.75;

    playBtn.addEventListener("click", () => {
      audio.play().catch(()=>{});
      playBtn.textContent = "Música activada 🎶";
    });

    vol.addEventListener("input", () => {
      audio.volume = vol.value / 100;
      volLabel.textContent = vol.value + "%";
    });

    // Cartas
    const box = document.getElementById("letter");

   const carta1 = `
  <h2>Mi amorcito Camila 💗</h2>

  <p>
    La verdad es que últimamente, por las vacaciones y todo eso,
    hemos estado un poquito distanciados… y casi siempre estoy ocupado.
    Entonces un día me pregunté:
    <b>¿por qué no hacerle algo especial a mi amor?</b>
  </p>

  <p>
    Si al final yo la amo a usted, usted es mi persona importante,
    mi lugar seguro. Esta idea se me ocurrió ayer como a las 6 de la mañana
    jsjs y bueno… aquí está.
  </p>

  <p>
    No fue tan fácil, pasé hartas rabias 😅
    incluso me obligaron a ir mañana a la playa
    y nos vamos a las 7, pero aun así
    <b>quería darle este detalle</b>.
  </p>

  <p>
    Tal vez no es la gran cosa y es algo virtual,
    pero está hecho con mucho cariño.
    Cada cosita fue pensada especialmente para usted.
  </p>

  <p>
    Espero que lo disfrute, bb 💞
  </p>

  <p class="sig">— Con todo mi amor ❤️</p>
`;

    const carta2 = `
  <h2>Mi amor 💘</h2>

  <p>
    Ya leyó la primera carta jsjs 🥺
    Qué bueno… ahora quiero preguntarle algo:
    <b>¿le está gustando cómo me quedó?</b>
    La verdad le puse harto esfuerzo y cariño.
  </p>

  <p>
    Esta carta es más que todo para pedirle perdón.
    Sé que a veces he hecho cosas que pueden hacerla sentir mal,
    pero créame que <b>nunca quiero que usted sufra</b>.
  </p>

  <p>
    Hay cosas que aún no he dicho, como lo de mi mamá,
    y no es porque no quiera, sino por miedo.
    Usted ya sabe eso y se lo he dicho.
  </p>

  <p>
    También quiero pedirle perdón por lesear tanto con que tiene otro,
    o con lo del Gus. La verdad no sé por qué lo hago,
    pero es porque la amo mucho, mucho, mucho…
    y pensar que usted se vaya con otra persona,
    especialmente con él, me dolería.
  </p>

  <p>
    Aunque en el fondo yo sé que eso no va a pasar,
    a veces mi mente me juega en contra.
  </p>

  <p>
    Usted siempre me hace cosas tan bonitas…
    entonces pensé:
    <b>¿por qué no hacerle yo algo también?</b>
  </p>

  <p>
    El otro día leí el frasquito
    y el mensaje de “me gusta su perfume” jsjs
    fue demasiado lindo.
    Gracias por esos detalles, bb.
  </p>

  <p class="sig">— Te amo con todo mi corazón 💗</p>
`;


    function show(html){
      box.classList.remove("hidden");
      box.innerHTML = html;
      box.scrollIntoView({behavior:"smooth", block:"start"});
    }

    document.getElementById("btnCarta1").addEventListener("click", () => show(carta1));
    document.getElementById("btnCarta2").addEventListener("click", () => show(carta2));
  </script>
</body>
</html>
