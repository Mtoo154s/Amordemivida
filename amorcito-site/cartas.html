<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Cartas 💌</title>
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>

<body class="hearts-bg">
  <div class="wrap">
    <div class="card glow">
      <div class="topbar">
        <a class="btn" href="home.html">⬅ Volver</a>
        <h1 class="title small">Cartas 💌</h1>
      </div>

      <p class="subtitle">Elige una carta, mi vida 💗</p>

      <!-- 🎵 Música Cartas -->
      <div class="audioBox">
        <button id="btnPlayMusic" class="btn">Reproducir música 🎵</button>

        <div class="volRow">
          <span>🔊</span>
          <input id="vol" type="range" min="0" max="100" value="75" />
          <span id="volLabel">75%</span>
        </div>
      </div>

      <audio id="bgAudio" src="assets/music/cartas.mp3" preload="auto" loop></audio>

      <!-- Botones de cartas -->
      <div class="row" style="margin-top:14px;">
        <button class="btn primary" id="btnCarta1">Carta 1</button>
        <button class="btn primary" id="btnCarta2">Carta 2</button>
      </div>

      <!-- Contenido -->
      <div id="letter" class="letter hidden"></div>
    </div>

    <footer class="footer">
      Desarrollado con el amor que le tengo ❤️
    </footer>
  </div>

  <script src="assets/js/app.js"></script>
  <script>
    // Proteger acceso (si no hizo login)
    LoveApp.protect();

    // Música + volumen 75%
    const audio = document.getElementById("bgAudio");
    const playBtn = document.getElementById("btnPlayMusic");
    const vol = document.getElementById("vol");
    const volLabel = document.getElementById("volLabel");

    audio.volume = 0.75;

    playBtn.addEventListener("click", () => {
      audio.play().catch(()=>{});
      playBtn.textContent = "Música activada 🎶";
    });

    vol.addEventListener("input", () => {
      audio.volume = vol.value / 100;
      volLabel.textContent = vol.value + "%";
    });

    // Cartas
    const box = document.getElementById("letter");

    const carta1 = `
      <h2>Mi amor 💗</h2>
      <p>
        (Aquí va la Carta 1. Escríbeme el texto y te lo dejo precioso.)
      </p>
      <p>
        Gracias por existir, por tu sonrisa, por tu forma de ser… por todo.
      </p>
      <p class="sig">— Con amor, siempre tuyo ❤️</p>
    `;

    const carta2 = `
      <h2>Para mi amorcito 💘</h2>
      <p>
        (Aquí va la Carta 2. Me mandas lo que quieres decirle y lo formateo lindo.)
      </p>
      <p>
        Eres mi lugar favorito.
      </p>
      <p class="sig">— Te amo muchísimo 💗</p>
    `;

    function show(html){
      box.classList.remove("hidden");
      box.innerHTML = html;
      box.scrollIntoView({behavior:"smooth", block:"start"});
    }

    document.getElementById("btnCarta1").addEventListener("click", () => show(carta1));
    document.getElementById("btnCarta2").addEventListener("click", () => show(carta2));
  </script>
</body>
</html>
